<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAFE Marketing Studio</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="marketing.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class="topbar">
  <a class="brand" href="../" title="Back to SAFE Master Studio">
    <img src="../assets/logo.png" alt="SAFE Legal Solutions">
    <span><span class="t1">SAFE Marketing Studio</span><span class="t2">SAFE Legal Solutions</span></span>
  </a>
  <span class="spacer"></span>
  <span class="user" id="who"></span>
  <button id="logout" hidden>Sign out</button>
</div>

<!-- Login -->
<div id="login" class="login" hidden>
  <div class="card">
    <img src="../assets/logo.png" alt="SAFE Legal Solutions" style="height:96px;display:block;margin:0 auto 10px">
    <h2 class="serif" style="text-align:center;color:var(--maroon)">Sign in to Marketing Studio</h2>
    <p class="muted small">SAFE team only. Use the email and PIN set up in the Users tab.</p>
    <label>Email</label><input id="loginEmail" type="email" autocomplete="username">
    <label>PIN</label><input id="loginPin" type="password" autocomplete="current-password">
    <div class="row" style="margin-top:14px"><button class="primary" id="loginBtn">Sign in</button><span id="loginErr" class="small" style="color:var(--red)"></span></div>
  </div>
</div>

<!-- App -->
<div id="app" class="layout" hidden>
  <nav class="side" id="nav">
    <a href="#dashboard" data-v="dashboard">Dashboard</a>
    <a href="#contacts" data-v="contacts">Contacts</a>
    <a href="#pipeline" data-v="pipeline">Pipeline</a>
    <a href="#campaigns" data-v="campaigns">Campaigns</a>
    <a href="#approvals" data-v="approvals">Approvals <span class="count" id="cntApprovals"></span></a>
    <a href="#replies" data-v="replies">Replies</a>
    <a href="#tasks" data-v="tasks">Follow-up tasks <span class="count" id="cntTasks"></span></a>
    <a href="#settings" data-v="settings" id="navSettings">Settings</a>
  </nav>
  <main id="view"></main>
</div>

<div id="modalRoot"></div>

<script src="../assets/config.js"></script>
<script src="mock.js"></script>
<script src="app.js"></script>
</body>
</html>

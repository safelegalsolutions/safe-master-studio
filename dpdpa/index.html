<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SAFE DPDPA Compliance Studio</title>
<link rel="icon" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="assets/dpdpa.css">
</head>
<body>
<div class="topbar">
  <a class="brand" href="../">
    <img src="assets/img/logo.png" alt="SAFE Legal Solutions">
    <span><span class="t1">SAFE DPDPA Compliance Studio</span><span class="t2">SAFE Legal Solutions</span></span>
  </a>
  <span class="ai-badge">SAFE AI</span>
  <span id="demoFlag" class="demo-flag" hidden>DEMO MODE</span>
  <span class="spacer"></span>
  <span class="user" id="who"></span>
  <button id="logout" hidden>Sign out</button>
</div>

<section id="login" class="login-card card" hidden>
  <img src="assets/img/logo.png" alt="">
  <h1 class="serif" style="color:var(--maroon);margin-top:8px">SAFE DPDPA Compliance Studio</h1>
  <p class="muted">SAFE team sign-in</p>
  <form id="loginForm" style="text-align:left">
    <label>Email</label><input id="lemail" type="email" autocomplete="username" required>
    <label>6-digit PIN</label><input id="lpin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" required>
    <button class="primary" style="width:100%;justify-content:center;margin-top:14px">Sign in</button>
  </form>
  <p class="small muted" id="demoHint" hidden style="margin-top:12px">Demo mode: admin@safelegal.org / 123456 (or advocate@safelegal.org / 123456). Data stays in this browser.</p>
</section>

<div id="app" class="shell" hidden>
  <nav class="side" id="side"></nav>
  <main class="main" id="main"></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="../assets/config.js"></script>
<script src="assets/js/controls.js"></script>
<script src="assets/js/engine.js"></script>
<script src="assets/js/docxgen.js"></script>
<script src="assets/js/report.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/mock.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/console.js"></script>
</body>
</html>
